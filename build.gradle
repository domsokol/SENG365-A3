plugins {
    id 'application'
}

group = 'seng365_b02_03'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Javalin + test tools + Jackson (JSON) + Logback, in one artifact.
    implementation 'io.javalin:javalin-bundle:7.2.3'
    // Reads the bike park seed data file.
    implementation 'com.google.code.gson:gson:2.13.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The starter layout keeps code in src/ and tests in test/, not src/main/java.
sourceSets {
    main {
        java { srcDirs = ['src'] }
    }
    test {
        java { srcDirs = ['test'] }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

application {
    mainClass = 'BikeParkService'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
